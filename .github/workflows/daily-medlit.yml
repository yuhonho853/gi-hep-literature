name: Daily MedLit Update

on:
  workflow_dispatch:
  schedule:
    # 07:00 Asia/Macau, expressed in UTC.
    - cron: "0 23 * * *"

permissions:
  contents: write

concurrency:
  group: daily-medlit-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for path in ["medical_literature_hub.py", "generate_medlit_web.py"]:
              ast.parse(Path(path).read_text(encoding="utf-8"))
              print(f"{path}: syntax ok")
          PY

      - name: Generate daily web report
        env:
          TZ: Asia/Macau
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python generate_medlit_web.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web
          if git diff --cached --quiet; then
            echo "No literature update to commit."
          else
            git commit -m "Update daily medical literature report"
            git push
          fi
